/* ===== SONIDO INTRO ===== */
let audioCtx = null;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playLightSound(delay = 0, pitch = 1200) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;

  const bufferSize = audioCtx.sampleRate * 0.04;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.15, t);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  noise.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);
  noise.start(t);

  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(pitch, t);
  osc.frequency.exponentialRampToValueAtTime(pitch * 0.5, t + 0.08);
  const oscGain = audioCtx.createGain();
  oscGain.gain.setValueAtTime(0.06, t);
  oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc.connect(oscGain);
  oscGain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.12);
}

function playNeonHum() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  osc.type = 'sine'; osc.frequency.value = 60;
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine'; osc2.frequency.value = 120;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.015;
  osc.connect(gain); osc2.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(); osc2.start();
  setTimeout(() => {
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    setTimeout(() => { osc.stop(); osc2.stop(); }, 600);
  }, 2500);
}

/* ===== INTRO ===== */
const intro = document.getElementById('intro');
const introTitle = document.getElementById('introTitle');
const introSub = document.getElementById('introSub');
const enterBtn = document.getElementById('enterBtn');

let introDone = false;

enterBtn.addEventListener('click', async () => {
  if (introDone) return;
  introDone = true;

  initAudio();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  enterBtn.style.opacity = '0';
  enterBtn.style.pointerEvents = 'none';

  playNeonHum();

  const totalLights = 10;
  for (let i = 0; i < totalLights; i++) {
    setTimeout(() => {
      playLightSound(0, 900 + i * 120);
      const t = (i + 1) / totalLights;
      introTitle.style.opacity = t;
      introTitle.style.color = `rgb(${Math.floor(255 * t)}, ${Math.floor(105 * t)}, ${Math.floor(180 * t)})`;
      introTitle.style.textShadow = `0 0 ${t * 40}px #ff1493, 0 0 ${t * 80}px #8b00ff`;
    }, i * 220);
  }

  setTimeout(() => {
    introTitle.classList.add('on');
    introSub.classList.add('on');
    playLightSound(0, 1800);
    setTimeout(() => {
      intro.classList.add('hide');
      setTimeout(() => intro.remove(), 1400);
    }, 1000);
  }, totalLights * 220 + 200);
});

/* ============================================================
   ESCENA 3D CON THREE.JS
   ============================================================ */
const sceneEl = document.getElementById('scene');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05010a, 0.06);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 9);
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
sceneEl.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffb6d9, 0.4));

const pointPink = new THREE.PointLight(0xff1493, 2, 30);
pointPink.position.set(5, 8, 5);
scene.add(pointPink);

const pointPurple = new THREE.PointLight(0x8b00ff, 2, 30);
pointPurple.position.set(-5, 6, -5);
scene.add(pointPurple);

/* ===== ÁRBOL 3D ===== */
const treeGroup = new THREE.Group();
scene.add(treeGroup);

const trunkMat = new THREE.MeshStandardMaterial({
  color: 0x3a1020,
  emissive: 0x4a0a20,
  emissiveIntensity: 0.3,
  roughness: 0.9
});
const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.35, 3, 8), trunkMat);
trunk.position.y = 1.5;
treeGroup.add(trunk);

function addBranch(x, y, z, rotZ, rotY, len, radius) {
  const branch = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 0.6, radius, len, 6),
    trunkMat
  );
  branch.position.set(x, y, z);
  branch.rotation.z = rotZ;
  branch.rotation.y = rotY;
  branch.translateY(len / 2);
  treeGroup.add(branch);
}

addBranch(-0.1, 2.6, 0, 0.6, 0, 1.8, 0.12);
addBranch(0.1, 2.6, 0, -0.6, 0, 1.8, 0.12);
addBranch(0, 2.9, 0.1, 0.2, Math.PI / 2, 1.5, 0.1);
addBranch(-0.5, 3.4, 0, 0.9, 0, 1.3, 0.08);
addBranch(0.5, 3.4, 0, -0.9, 0, 1.3, 0.08);

const crownData = [
  { x: -1.3, y: 4.2, z: 0,    r: 0.9,  color: 0xff69b4 },
  { x: 1.3,  y: 4.2, z: 0,    r: 0.9,  color: 0xff1493 },
  { x: -0.6, y: 4.9, z: 0.5,  r: 0.85, color: 0xffb6d9 },
  { x: 0.6,  y: 4.9, z: -0.5, r: 0.85, color: 0xff69b4 },
  { x: 0,    y: 5.4, z: 0,    r: 0.75, color: 0xff1493 },
  { x: 0,    y: 4.5, z: 0.9,  r: 0.7,  color: 0x8b00ff },
  { x: 0,    y: 4.5, z: -0.9, r: 0.7,  color: 0xff69b4 }
];

const crowns = [];
crownData.forEach((c, i) => {
  const mat = new THREE.MeshStandardMaterial({
    color: c.color,
    emissive: c.color,
    emissiveIntensity: 1.2,
    transparent: true,
    opacity: 0.75,
    roughness: 0.4
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(c.r, 16, 16), mat);
  mesh.position.set(c.x, c.y, c.z);
  mesh.userData.pulseOffset = i * 0.5;
  treeGroup.add(mesh);
  crowns.push(mesh);
});

const sparkleGeo = new THREE.BufferGeometry();
const sparklePositions = [];
for (let i = 0; i < 120; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = Math.random() * 1.5;
  const y = 4.5 + (Math.random() - 0.5) * 2;
  sparklePositions.push(
    Math.cos(angle) * radius * 1.3,
    y,
    Math.sin(angle) * radius * 1.3
  );
}
sparkleGeo.setAttribute('position', new THREE.Float32BufferAttribute(sparklePositions, 3));
const sparkleMat = new THREE.PointsMaterial({
  color: 0xffd0e6,
  size: 0.09,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending
});
const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
treeGroup.add(sparkles);

/* ===== PÉTALOS 3D ===== */
const petalCount = 200;
const petalGeo = new THREE.BufferGeometry();
const petalPositions = new Float32Array(petalCount * 3);
const petalVelocities = [];
const petalColors = new Float32Array(petalCount * 3);

for (let i = 0; i < petalCount; i++) {
  petalPositions[i * 3]     = (Math.random() - 0.5) * 20;
  petalPositions[i * 3 + 1] = Math.random() * 12;
  petalPositions[i * 3 + 2] = (Math.random() - 0.5) * 20;
  petalVelocities.push({
    y: -(0.008 + Math.random() * 0.02),
    x: (Math.random() - 0.5) * 0.01,
    z: (Math.random() - 0.5) * 0.01,
    phase: Math.random() * Math.PI * 2
  });
  const c = new THREE.Color().setHSL(0.92 + Math.random() * 0.05, 0.9, 0.7);
  petalColors[i * 3]     = c.r;
  petalColors[i * 3 + 1] = c.g;
  petalColors[i * 3 + 2] = c.b;
}

petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPositions, 3));
petalGeo.setAttribute('color', new THREE.BufferAttribute(petalColors, 3));

const petalMat = new THREE.PointsMaterial({
  size: 0.14,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const petalSystem = new THREE.Points(petalGeo, petalMat);
scene.add(petalSystem);

/* ===== SECCIONES ALREDEDOR DEL ÁRBOL ===== */
const orbitRadius = 4.5;
const sectionObjects = [];

sections.forEach((sec, i) => {
  const angle = (i / sections.length) * Math.PI * 2;
  const x = Math.cos(angle) * orbitRadius;
  const z = Math.sin(angle) * orbitRadius;
  const y = 2.5;

  const group = new THREE.Group();
  group.position.set(x, y, z);

  const sphereMat = new THREE.MeshStandardMaterial({
    color: sec.color,
    emissive: sec.color,
    emissiveIntensity: 0.8,
    transparent: true,
    opacity: 0.85,
    roughness: 0.3
  });
  const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 24), sphereMat);
  group.add(sphere);

  const auraMat = new THREE.MeshBasicMaterial({
    color: sec.color,
    transparent: true,
    opacity: 0.15,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide
  });
  const aura = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 24), auraMat);
  group.add(aura);

  const emojiCanvas = document.createElement('canvas');
  emojiCanvas.width = 256; emojiCanvas.height = 256;
  const cx = emojiCanvas.getContext('2d');
  cx.font = '160px serif';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText(sec.emoji, 128, 140);

  const texture = new THREE.CanvasTexture(emojiCanvas);
  const spriteMat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthTest: false
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(0.9, 0.9, 1);
  sprite.position.z = 0.6;
  group.add(sprite);

  group.userData = {
    index: i,
    baseAngle: angle,
    sphere,
    aura,
    sprite,
    color: sec.color
  };

  scene.add(group);
  sectionObjects.push(group);
});

/* ============================================================
   INTERACCIÓN CON ARRASTRE
   ============================================================ */
let targetRotation = 0;
let currentRotation = 0;
let isDragging = false;
let lastX = 0;
let lastTime = 0;
let velocity = 0;
let autoRotate = true;

const infoPanel = document.getElementById('infoPanel');
let activeIndex = -1;

function updateActiveSection() {
  let bestIndex = -1;
  let bestZ = -Infinity;

  sectionObjects.forEach((obj, i) => {
    const worldPos = new THREE.Vector3();
    obj.getWorldPosition(worldPos);
    if (worldPos.z > bestZ) {
      bestZ = worldPos.z;
      bestIndex = i;
    }
  });

  if (bestIndex !== activeIndex && bestIndex !== -1) {
    activeIndex = bestIndex;

    sectionObjects.forEach((obj, i) => {
      const isActive = i === bestIndex;
      obj.userData.sphere.material.emissiveIntensity = isActive ? 2.5 : 0.8;
      obj.userData.aura.material.opacity = isActive ? 0.5 : 0.15;
      obj.userData.sphere.scale.setScalar(isActive ? 1.3 : 1);
    });

    infoPanel.innerHTML = sections[bestIndex].html;
    infoPanel.classList.add('show');
  }
}

const canvasEl = renderer.domElement;

canvasEl.addEventListener('pointerdown', (e) => {
  isDragging = true;
  lastX = e.clientX;
  lastTime = performance.now();
  velocity = 0;
  autoRotate = false;
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const now = performance.now();
  const dt = now - lastTime;

  targetRotation += dx * 0.008;
  velocity = dx * 0.008 / (dt / 16);
  lastX = e.clientX;
  lastTime = now;
});

window.addEventListener('pointerup', () => {
  isDragging = false;
  velocity *= 0.9;
});

canvasEl.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const touch = e.touches[0];
  const dx = touch.clientX - lastX;
  targetRotation += dx * 0.008;
  lastX = touch.clientX;
}, { passive: false });

/* ============================================================
   ANIMACIÓN
   ============================================================ */
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();

  if (autoRotate || !isDragging) {
    targetRotation += 0.003;
  }

  if (!isDragging && Math.abs(velocity) > 0.0001) {
    targetRotation += velocity;
    velocity *= 0.94;
  }

  currentRotation += (targetRotation - currentRotation) * 0.08;

  treeGroup.rotation.y = currentRotation;
  sectionObjects.forEach(obj => {
    obj.position.x = Math.cos(obj.userData.baseAngle + currentRotation) * orbitRadius;
    obj.position.z = Math.sin(obj.userData.baseAngle + currentRotation) * orbitRadius;
    obj.rotation.y = currentRotation;
  });

  crowns.forEach((c, i) => {
    const pulse = 1 + Math.sin(elapsed * 2 + c.userData.pulseOffset) * 0.08;
    c.scale.setScalar(pulse);
    c.material.emissiveIntensity = 1.0 + Math.sin(elapsed * 3 + c.userData.pulseOffset) * 0.6;
  });

  sectionObjects.forEach(obj => {
    obj.userData.aura.rotation.y += 0.01;
  });

  const positions = petalSystem.geometry.attributes.position.array;
  for (let i = 0; i < petalCount; i++) {
    const v = petalVelocities[i];
    positions[i * 3 + 1] += v.y;
    positions[i * 3]     += v.x + Math.sin(elapsed + v.phase) * 0.003;
    positions[i * 3 + 2] += v.z;

    if (positions[i * 3 + 1] < -2) {
      positions[i * 3 + 1] = 12;
      positions[i * 3]     = (Math.random() - 0.5) * 20;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
    }
  }
  petalSystem.geometry.attributes.position.needsUpdate = true;

  updateActiveSection();

  renderer.render(scene, camera);
}
animate();

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
